<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="720" height="300" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <g font-size="13" fill="#1e293b">
    <rect x="30" y="120" width="150" height="60" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="105" y="145" text-anchor="middle" font-weight="600">Browser SPA</text>
    <text x="105" y="163" text-anchor="middle" font-size="11" fill="#64748b">React + Vite</text>

    <rect x="290" y="60" width="170" height="60" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="375" y="85" text-anchor="middle" font-weight="600">Auth gate</text>
    <text x="375" y="103" text-anchor="middle" font-size="11" fill="#64748b">shared/auth-core</text>

    <rect x="290" y="180" width="170" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="375" y="205" text-anchor="middle" font-weight="600">Static assets</text>
    <text x="375" y="223" text-anchor="middle" font-size="11" fill="#64748b">dist/ (app shell)</text>

    <rect x="540" y="120" width="150" height="60" rx="10" fill="#fefce8" stroke="#eab308"/>
    <text x="615" y="145" text-anchor="middle" font-weight="600">content/</text>
    <text x="615" y="163" text-anchor="middle" font-size="11" fill="#64748b">.md · .html · assets</text>

    <line x1="180" y1="140" x2="290" y2="95" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="225" y="105" font-size="11" fill="#64748b">/api/auth/*</text>
    <line x1="180" y1="155" x2="290" y2="200" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="215" y="200" font-size="11" fill="#64748b">app shell</text>
    <line x1="460" y1="95" x2="540" y2="145" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="480" y="110" font-size="11" fill="#64748b">/content/* (protected)</text>
  </g>
</svg>
